name: DazzCam

options:
  bundleIdPrefix: com.diego
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DazzCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: DazzCam

    settings:
      base:
        PRODUCT_NAME: DazzCam
        PRODUCT_BUNDLE_IDENTIFIER: com.diego.dazzcam
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

    info:
      path: DazzCam/Info.plist
      properties:
        CFBundleDisplayName: DazzCam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: DazzCam usa la camara para tomar fotos y grabar video.
        NSMicrophoneUsageDescription: DazzCam usa el microfono para grabar el sonido del video.
        NSPhotoLibraryAddUsageDescription: DazzCam guarda tus fotos y videos en tu fototeca.
        NSPhotoLibraryUsageDescription: DazzCam abre tu fototeca para mostrar y editar tus fotos.

schemes:
  DazzCam:
    build:
      targets:
        DazzCam: all
    run:
      config: Debug
    archive:
      config: Release
